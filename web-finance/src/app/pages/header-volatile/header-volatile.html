
<div
    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm
         dark:border-slate-800 dark:bg-slate-900 md:p-5">

    <!-- En-tête -->
    <div class="mb-5">
        <h2 class="text-base font-semibold text-slate-900 dark:text-white">
            Paramètres de l'analyse
        </h2>

        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Sélectionnez les actifs et la période à analyser.
        </p>
    </div>

    <!-- Formulaire de sélection -->
    <div class="grid grid-cols-1 items-end gap-4 md:grid-cols-2 xl:grid-cols-3">

        <!-- Sélection des actifs -->
        <div class="min-w-0">
            <label
                for="actifs"
                class="mb-2 block text-sm font-medium text-slate-700
               dark:text-slate-300">
                Actifs financiers
            </label>

            <p-multiSelect
                inputId="actifs"
                [options]="actifsDisponibles"
                [(ngModel)]="actifsChoisis"
                optionLabel="label"
                optionValue="value"
                placeholder="Sélectionner les actifs"
                selectedItemsLabel="{0} actifs sélectionnés"
                [maxSelectedLabels]="2"
                [filter]="true"
                filterPlaceHolder="Rechercher un actif"
                [showClear]="true"
                [appendTo]="'body'"
                styleClass="w-full">

                <ng-template pTemplate="empty">
                    <div class="p-3 text-sm text-slate-500">
                        Aucun actif disponible.
                    </div>
                </ng-template>

            </p-multiSelect>

            <p class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">
                Sélectionnez un ou plusieurs actifs pour l'analyse.
            </p>
        </div>

        <!-- Sélection de la période -->
        <div class="min-w-0">
            <label
                for="periode"
                class="mb-2 block text-sm font-medium text-slate-700
               dark:text-slate-300">
                Période d'analyse
            </label>

            <p-select
                inputId="periode"
                [options]="periodes"
                [(ngModel)]="periodeChoisie"
                optionLabel="label"
                optionValue="value"
                placeholder="Choisir une période"
                [appendTo]="'body'"
                styleClass="w-full">
            </p-select>

            <p class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">
                Historique utilisé pour calculer la volatilité.
            </p>
        </div>

        <!-- Bouton d'analyse -->
        <div class="md:col-span-2 xl:col-span-1">
            <p-button
                label="Analyser"
                icon="pi pi-chart-line"
                [loading]="chargement"
                [disabled]="analyseDesactivee"
                (onClick)="lancerAnalyse()"
                styleClass="w-full">
            </p-button>
        </div>

    </div>

    <!-- Informations sur la sélection -->
    <div
        class="mt-4 flex flex-wrap items-center gap-3 border-t
           border-slate-100 pt-4 dark:border-slate-800">

    <span
        class="inline-flex items-center gap-2 rounded-lg bg-blue-50
             px-3 py-2 text-xs font-medium text-blue-700
             dark:bg-blue-950 dark:text-blue-300">

      <i class="pi pi-calendar"></i>

        {{ periodeChoisie }} jours
    </span>

        <span
            class="inline-flex items-center gap-2 rounded-lg bg-slate-100
             px-3 py-2 text-xs font-medium text-slate-600
             dark:bg-slate-800 dark:text-slate-300">

      <i class="pi pi-chart-bar"></i>

            {{ actifsChoisis.length }}
            actif(s) sélectionné(s)
    </span>

    </div>

</div>
