<div class="grid grid-cols-12 gap-6">

    <!-- KPI : composant existant -->
    <app-stats-widget class="contents" />

    <!-- Ligne 1 : le wrapper "grid" étire le composant en largeur ET en hauteur -->
    <div class="col-span-12 grid min-w-0 lg:col-span-7">
        <app-market-evolution-widget />
    </div>

    <div class="col-span-12 grid min-w-0 lg:col-span-5">
        <app-portofolio-distribution />
    </div>

    <!-- Ligne 2 : TopMoves et Actualités -->
    <div class="col-span-12 grid min-w-0 grid-cols-1 gap-6 lg:grid-cols-2">

        <!-- TopMoves -->
        <div class="min-w-0 rounded-2xl">
            <app-topmoves />
        </div>

        <!-- Actualités : version courte, même hauteur que TopMoves -->
        <div class="relative h-[28rem] min-w-0 overflow-hidden rounded-2xl lg:h-auto lg:min-h-[28rem]">
            <app-actualites [compact]="true" class="block h-full lg:absolute lg:inset-0" />
        </div>

    </div>

</div>
