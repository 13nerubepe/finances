
<div class="grid grid-cols-12 gap-6">
    <!-- KPI : conserver le composant existant -->
    <app-stats-widget class="contents" />

    <!-- Première ligne : hauteurs identiques, largeurs différentes -->
    <div class="col-span-12 grid min-w-0 grid-cols-12 items-stretch gap-6">

        <!-- Évolution du marché : 7/12 -->
        <div class="col-span-12 min-w-0 lg:col-span-7">
            <div class="h-full">
                <app-market-evolution-widget />
            </div>
        </div>

        <!-- Répartition du portefeuille : 5/12 -->
        <div class="col-span-12 min-w-0 lg:col-span-5">
            <div class="h-full">
                <app-portofolio-distribution />
            </div>
        </div>

    </div>

    <!-- Deuxième ligne : hauteurs identiques, plus compacte -->
    <div class="col-span-12 grid min-w-0 grid-cols-12 items-stretch gap-6">

        <!-- Top mouvements : 6/12 -->
        <div class="col-span-12 min-w-0 lg:col-span-6">
            <div class="h-full">
                <app-topmoves />
            </div>
        </div>

        <!-- Actualités : 6/12 -->
        <div class="col-span-12 min-w-0 lg:col-span-6">
            <div class="h-full">
                <app-actualites />
            </div>
        </div>

    </div>

</div>
