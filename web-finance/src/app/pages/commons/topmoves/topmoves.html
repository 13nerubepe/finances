<div class="flex h-full min-w-0 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">

    <!-- En-tête -->
    <div class="flex items-center justify-between gap-2 border-b border-slate-100 px-4 py-3 dark:border-slate-700">
        <div class="min-w-0">
            <h2 class="m-0 !text-sm !font-bold !leading-tight text-slate-800 dark:text-white">
                Top mouvements
            </h2>
            <p class="mb-0 mt-0.5 text-xs text-slate-500 dark:text-slate-400">
                Plus fortes variations du marché
            </p>
        </div>

        <button
            type="button"
            (click)="loadTopMovers()"
            [disabled]="loading"
            aria-label="Actualiser"
            title="Actualiser"
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 disabled:opacity-50 dark:text-slate-300 dark:hover:bg-slate-800">
            <i class="pi pi-refresh text-xs" [class.pi-spin]="loading"></i>
        </button>
    </div>

    <!-- Boutons Gagnants / Perdants -->
    <div class="px-4 pt-3">
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-800">

            <button
                type="button"
                (click)="activeTab = 'gagnants'"
                [class]="activeTab === 'gagnants'
                    ? 'bg-white text-emerald-700 shadow-sm dark:bg-slate-900 dark:text-emerald-400'
                    : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'"
                class="flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-xs font-semibold transition">
                <i class="pi pi-arrow-up-right text-xs"></i>
                Gagnants
                <span class="rounded-full bg-emerald-50 px-1.5 text-[10px] text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400">
                    {{ topGagnants.length }}
                </span>
            </button>

            <button
                type="button"
                (click)="activeTab = 'perdants'"
                [class]="activeTab === 'perdants'
                    ? 'bg-white text-red-600 shadow-sm dark:bg-slate-900 dark:text-red-400'
                    : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'"
                class="flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-xs font-semibold transition">
                <i class="pi pi-arrow-down-right text-xs"></i>
                Perdants
                <span class="rounded-full bg-red-50 px-1.5 text-[10px] text-red-600 dark:bg-red-500/10 dark:text-red-400">
                    {{ topPerdants.length }}
                </span>
            </button>

        </div>
    </div>

    <!-- Liste -->
    <div class="flex flex-1 flex-col p-3">

        @if (loading) {
            <div class="flex flex-1 items-center justify-center gap-2 py-8 text-xs text-slate-500 dark:text-slate-400">
                <i class="pi pi-spin pi-spinner text-emerald-600"></i>
                Chargement...
            </div>
        } @else if (errorMessage) {
            <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-xs text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300">
                {{ errorMessage }}
            </div>
        } @else if (currentList.length === 0) {
            <div class="flex flex-1 items-center justify-center py-8 text-xs text-slate-500 dark:text-slate-400">
                {{ activeTab === 'gagnants' ? 'Aucun gagnant disponible.' : 'Aucun perdant disponible.' }}
            </div>
        } @else {
            <div class="divide-y divide-slate-100 dark:divide-slate-800">
