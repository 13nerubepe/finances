<!-- Bouton flottant -->
<button
    type="button"
    class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-primary text-primary-contrast shadow-xl transition-transform hover:scale-105 focus:outline-none focus-visible:ring-4 focus-visible:ring-primary/40"
    [attr.aria-label]="open() ? 'Fermer l\'assistant IA' : 'Ouvrir l\'assistant IA'"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
>
    @if (open()) {
        <i class="pi pi-times text-xl"></i>
    } @else {
        <!-- SVG robot -->
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" aria-hidden="true">
            <line x1="16" y1="9" x2="16" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="16" cy="4" r="1.8" fill="currentColor" class="animate-pulse" />
            <rect x="6" y="9" width="20" height="16" rx="5" stroke="currentColor" stroke-width="2" />
            <rect x="2.5" y="14" width="3" height="6" rx="1.5" fill="currentColor" />
            <rect x="26.5" y="14" width="3" height="6" rx="1.5" fill="currentColor" />
            <circle cx="12" cy="16" r="2.2" fill="currentColor" />
            <circle cx="20" cy="16" r="2.2" fill="currentColor" />
            <path d="M12 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
    }
</button>

<!-- Fenêtre de discussion -->
@if (open()) {
    <section
        class="fixed bottom-24 right-4 z-50 flex h-[32rem] max-h-[75vh] w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-3xl border border-surface-200 bg-surface-0 shadow-2xl dark:border-surface-700 dark:bg-surface-900 sm:right-6 sm:w-96"
        role="dialog"
        aria-label="Assistant IA"
        (keydown.escape)="open.set(false)"
    >
        <!-- En-tête -->
        <header class="flex items-center gap-3 bg-primary px-5 py-4 text-primary-contrast">
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-white/20">
                <svg viewBox="0 0 32 32" fill="none" class="h-7 w-7" aria-hidden="true">
                    <line x1="16" y1="9" x2="16" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle cx="16" cy="4" r="1.8" fill="currentColor" />
                    <rect x="6" y="9" width="20" height="16" rx="5" stroke="currentColor" stroke-width="2" />
                    <rect x="2.5" y="14" width="3" height="6" rx="1.5" fill="currentColor" />
                    <rect x="26.5" y="14" width="3" height="6" rx="1.5" fill="currentColor" />
                    <circle cx="12" cy="16" r="2.2" fill="currentColor" />
                    <circle cx="20" cy="16" r="2.2" fill="currentColor" />
                    <path d="M12 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </div>
            <div class="flex flex-col leading-tight">
                <span class="font-semibold">Assistant robot</span>
                <span class="text-xs opacity-80">En ligne</span>
            </div>
            <button
                type="button"
                class="ml-auto flex h-8 w-8 items-center justify-center rounded-full hover:bg-white/20"
                aria-label="Effacer la conversation"
                (click)="reset()"
            >
                <i class="pi pi-refresh text-sm"></i>
            </button>
        </header>

        <!-- Messages -->
        <div #scrollArea class="flex flex-1 flex-col gap-3 overflow-y-auto bg-surface-50 p-4 dark:bg-surface-950">
            @for (msg of messages(); track msg.id) {
                <div class="flex items-end gap-2" [class.justify-end]="msg.role === 'user'">
                    @if (msg.role === 'assistant') {
                        <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary">
                            <svg viewBox="0 0 32 32" fill="none" class="h-5 w-5" aria-hidden="true">
                                <line x1="16" y1="9" x2="16" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                                <rect x="6" y="9" width="20" height="16" rx="5" stroke="currentColor" stroke-width="2.5" />
                                <circle cx="12" cy="16" r="2.2" fill="currentColor" />
                                <circle cx="20" cy="16" r="2.2" fill="currentColor" />
                            </svg>
                        </div>
                    }

                    <div
                        class="max-w-[80%] whitespace-pre-line rounded-2xl px-4 py-2.5 text-sm"
                        [class]="msg.role === 'user'
                            ? 'rounded-br-md bg-primary text-primary-contrast'
                            : 'rounded-bl-md bg-surface-0 text-surface-800 shadow-sm dark:bg-surface-800 dark:text-surface-100'"
                    >
                        {{ msg.text }}
                    </div>
                </div>
            }

            <!-- Indicateur de saisie -->
            @if (typing()) {
                <div class="flex items-end gap-2">
                    <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary">
                        <svg viewBox="0 0 32 32" fill="none" class="h-5 w-5" aria-hidden="true">
                            <line x1="16" y1="9" x2="16" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                            <rect x="6" y="9" width="20" height="16" rx="5" stroke="currentColor" stroke-width="2.5" />
                            <circle cx="12" cy="16" r="2.2" fill="currentColor" />
                            <circle cx="20" cy="16" r="2.2" fill="currentColor" />
                        </svg>
                    </div>
                    <div class="flex items-center gap-1 rounded-2xl rounded-bl-md bg-surface-0 px-4 py-3 shadow-sm dark:bg-surface-800" aria-label="Le robot écrit">
                        <span class="h-2 w-2 animate-bounce rounded-full bg-surface-400"></span>
                        <span class="h-2 w-2 animate-bounce rounded-full bg-surface-400 [animation-delay:150ms]"></span>
                        <span class="h-2 w-2 animate-bounce rounded-full bg-surface-400 [animation-delay:300ms]"></span>
                    </div>
                </div>
            }

            <!-- Suggestions (uniquement au début) -->
            @if (messages().length === 1 && !typing()) {
                <div class="mt-1 flex flex-wrap gap-2">
                    @for (s of suggestions; track s) {
                        <button
                            type="button"
                            class="rounded-full border border-primary/40 bg-surface-0 px-3 py-1.5 text-xs font-medium text-primary hover:bg-primary/10 dark:bg-surface-900"
                            (click)="send(s)"
                        >
                            {{ s }}
                        </button>
                    }
                </div>
            }
        </div>

        <!-- Saisie -->
        <form class="flex items-center gap-2 border-t border-surface-200 p-3 dark:border-surface-700" (ngSubmit)="send()">
            <input
                pInputText
                type="text"
                name="question"
                autocomplete="off"
                placeholder="Posez votre question..."
                class="w-full !rounded-full"
                [(ngModel)]="draft"
                [disabled]="typing()"
            />
            <button
                type="submit"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary text-primary-contrast disabled:opacity-50"
                aria-label="Envoyer"
                [disabled]="typing() || !draft.trim()"
            >
                <i class="pi pi-send text-sm"></i>
            </button>
        </form>
    </section>
}
