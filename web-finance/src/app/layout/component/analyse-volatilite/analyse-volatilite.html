<div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-sm font-semibold text-slate-800">
            Volatilité ({{ days }} derniers jours)
        </h2>
        <div class="flex items-center gap-4 text-[11px] text-slate-600">
            <span class="flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-blue-600"></span> Cours
            </span>
            <span class="flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-orange-500"></span> Volatilité (20j)
            </span>
        </div>
    </div>

    <svg [attr.viewBox]="'0 0 ' + W + ' ' + H" class="h-auto w-full">
        <defs>
            <linearGradient id="priceFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22" />
                <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
            </linearGradient>
        </defs>

        <!-- Grille + axe gauche (cours) -->
        <g *ngFor="let t of priceTicks">
            <line
                [attr.x1]="padL" [attr.x2]="W - padR"
                [attr.y1]="t.y" [attr.y2]="t.y"
                stroke="#e2e8f0" stroke-dasharray="3 3" />
            <text [attr.x]="padL - 6" [attr.y]="t.y + 3" text-anchor="end" font-size="9" fill="#64748b">
                {{ t.label }}
            </text>
        </g>

        <!-- Axe droit (volatilité) -->
        <text
            *ngFor="let t of volTicks"
            [attr.x]="W - padR + 6" [attr.y]="t.y + 3"
            text-anchor="start" font-size="9" fill="#f97316">
            {{ t.label }}
        </text>

        <!-- Axe X (dates) -->
        <text
            *ngFor="let l of xLabels"
            [attr.x]="l.x" [attr.y]="H - 8"
            text-anchor="middle" font-size="9" fill="#64748b">
            {{ l.label }}
        </text>

        <!-- Courbes -->
        <path [attr.d]="priceArea" fill="url(#priceFill)" />
        <path [attr.d]="pricePath" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" />
        <path [attr.d]="volPath" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" />
    </svg>
</div>
