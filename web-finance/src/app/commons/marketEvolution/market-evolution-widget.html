
<div class="card !mb-8 overflow-hidden !rounded-2xl !border !border-slate-200 !p-0 shadow-sm dark:!border-slate-700">

    <!-- En-tête -->
    <div class="flex flex-col gap-4 border-b border-slate-100 px-6 py-5 dark:border-slate-700 md:flex-row md:items-center md:justify-between">

        <div class="flex items-start gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#048216]/10 text-[#048216]">
                <i class="pi pi-chart-line text-xl"></i>
            </div>

            <div>
                <h2 class="m-0 text-lg font-bold tracking-tight text-slate-800 dark:text-white">
                    Évolution du marché
                </h2>
            </div>
        </div>

        <p-selectButton
            [options]="periods"
            [(ngModel)]="selectedPeriod"
            optionLabel="label"
            optionValue="value"
            (onChange)="onPeriodChange()"
            styleClass="text-sm"
            [allowEmpty]="false">
        </p-selectButton>

    </div>

    <!-- Liste des actifs -->
    <div class="border-b border-slate-100 px-6 py-5 dark:border-slate-700">

        <div class="mb-4 flex items-center justify-between">
            <div>
                <h3 class="m-0 text-base font-semibold text-slate-800 dark:text-white">
                    Actifs du marché
                </h3>
                <p class="mt-1 mb-0 text-sm text-slate-500 dark:text-slate-400">
                    Sélectionnez un actif pour consulter son évolution
                </p>
            </div>

            <span class="rounded-full bg-[#048216]/10 px-3 py-1 text-xs font-semibold text-[#048216]">
            {{ assets?.length || 0 }} actifs
        </span>
        </div>

        <div class="flex gap-3 overflow-x-auto pb-2">
            <button
                *ngFor="let asset of assets"
                type="button"
                (click)="onAssetChange(asset)"
                class="flex min-w-[170px] items-center gap-3 rounded-xl border p-3 text-left transition-all"
                [ngClass]="selectedAsset?.id === asset.id
                ? 'border-[#048216] bg-[#048216]/5 ring-1 ring-[#048216]/20'
                : 'border-slate-200 bg-white hover:border-slate-300 dark:border-slate-700 dark:bg-slate-800'"
            >
                <div
                    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
                    [ngClass]="selectedAsset?.id === asset.id
                    ? 'bg-[#048216] text-white'
                    : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'"
                >
                    <i class="pi pi-chart-line text-lg"></i>
                </div>

                <div class="min-w-0 flex-1">
                    <div class="truncate text-sm font-semibold text-slate-800 dark:text-white">
                        {{ asset.name }}
                    </div>
                    <div class="mt-1 truncate text-xs text-slate-500 dark:text-slate-400">
                        {{ asset.symbol }}
                    </div>
                </div>

                <i
                    *ngIf="selectedAsset?.id === asset.id"
                    class="pi pi-check-circle text-[#048216]"
                ></i>
            </button>
        </div>

    </div>

    <!-- Graphique -->
    <div class="px-4 pb-5 sm:px-6">
        <div class="mb-4 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">
                Tendance du marché
            </h3>
            <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                <span class="h-2 w-2 rounded-full bg-[#048216]"></span>
                Performance
            </span>
        </div>

        <div class="h-[320px] w-full">
            <p-chart
                type="line"
                [data]="chartData"
                [options]="chartOptions"
                class="h-full w-full">
            </p-chart>
        </div>
    </div>

</div>
